<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <title>Семейная летопись</title>

    <meta name="theme-color" content="#1b1c1f" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Семейное древо" />
    <meta property="og:title" content="Семейное древо" />
    <meta property="og:description" content="Интерактивное родовое древо: ветви семьи от самых ранних предков до наших дней." />
    <meta property="og:url" content="https://perovsky.family/" />
    <meta property="og:image" content="https://perovsky.family/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
