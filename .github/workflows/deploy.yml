name: Deploy

on:
  push:
    tags: ['v[0-9]*']   # version tags like v0.1.0 (the job guard enforces tag == v<VERSION>)
  workflow_dispatch:

# Least privilege at the top; deploy-api widens for Workload Identity Federation below.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-api:
    name: deploy-api
    runs-on: ubuntu-latest
    # Stable OIDC subject (repo:<owner>/<repo>:environment:production) → one Google
    # Workload Identity Federation binding covers every release tag and manual run.
    environment: production
    permissions:
      contents: read
      id-token: write   # Google Cloud Workload Identity Federation (keyless OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA_SHORT="${GITHUB_SHA::7}"
          # Artifact Registry path: <region>-docker.pkg.dev/<project>/<repo>/familytree-api
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/familytree-api"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "suffix=v$(echo "$VERSION" | tr '.' '-')-$SHA_SHORT" >> "$GITHUB_OUTPUT"
          # On a version tag, the tag must match the VERSION file (tag == v<VERSION>).
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != v$VERSION (VERSION file). Bump VERSION or fix the tag."
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.image }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --image ${{ steps.ver.outputs.image }}:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --revision-suffix ${{ steps.ver.outputs.suffix }} \
            --update-env-vars APP_COMMIT=${{ steps.ver.outputs.sha_short }}

  deploy-spa:
    name: deploy-spa
    needs: [deploy-api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          APP_COMMIT: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/frontend
          # `--branch` is the Cloudflare Pages prod/preview LABEL for a Direct Upload
          # (not a git branch). Releases deploy from a `vX.Y.Z` tag, so this is
          # a constant `production` that must equal the project's production branch
          # (set by setup-gcp-deploy.ps1) — otherwise the deploy lands as a *preview*
          # and misses the production API_ORIGIN.
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=production
