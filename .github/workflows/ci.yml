name: CI

on:
  pull_request:
    branches: [main, "release-*"]
  push:
    branches: [main, "release-*"]

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test (with coverage)
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          fail_ci_if_error: false

      - name: Audit NuGet packages for known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.log
          if grep -qE "has the following vulnerable packages" audit.log; then
            echo "::error::Vulnerable NuGet packages detected (see log above)."
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (type-check + bundle)
        run: npm run build

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src/frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      # Audit the full dependency tree for known vulnerabilities. The dev
      # toolchain was upgraded (Vite 8 / Vitest 4), clearing the old
      # esbuild/vite/vitest advisories, so this no longer needs --omit=dev.
      - name: Audit npm packages for known vulnerabilities
        run: npm audit --audit-level=high
